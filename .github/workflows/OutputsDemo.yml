name: outputs Demo
on:
    workflow_dispatch:

jobs:
    demo:
        runs-on: ubuntu-latest

        steps:
            - name: Generate Version
              id: version_id
              run: |
                echo "VERSION=1.0.13" >> $GITHUB_OUTPUT

            - name: Print Version
              run: |
                echo "Version = ${{steps.version_id.outputs.VERSION}}"