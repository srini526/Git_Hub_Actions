name: job output demo
on:
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest

        outputs:
            app_version: ${{steps.version.outputs.VERSION}}
        
        steps:
          - name: Generate version
            id: version
            run: |
              echo "VERSION = 1.0.5" >> GITHUB_OUTPUT

    deploy:
        needs: build

        runs-on: ubuntu-latest

        steps:
          - name: Deploy
            run: |
              echo "Deploying Version ${{needs.build.outputs.app_version}}"