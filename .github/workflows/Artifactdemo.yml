name: artifact demo
on:
    workflow_dispatch:

jobs:
    demo:
        runs-on: ubuntu-latest

        steps:
            - name: Create Report
              run: |
               echo "Name: Srinivas" > student.txt
               echo "Age: 21" >> student.txt
               echo "City: Pune" >> student.txt

            - name: Upload Report
              uses: actions/upload-artifact@v4

              with:
                name: Student_report
                path: student.txt